name: Native Windows SDK
on:
  push:
    branches: [main, feat/windows-lifecycle]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: insightos-community/ability-scaffold
          ref: 48f7b9f6f01e5657cfba3613952b6578cb1d08d0
          path: .output/scaffold
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.12
      - name: Build verified native launcher
        run: cl /std:c++20 /EHsc /MT /O2 .output/scaffold/native/windows/ability.cpp /Fe:.output/ability.exe /link shell32.lib
      - name: Build and install SDK wheel
        run: |
          uv build
          if ($LASTEXITCODE -ne 0) { throw 'Wheel build failed' }
          uv venv .output/venv --python 3.13.15
          if ($LASTEXITCODE -ne 0) { throw 'Venv creation failed' }
          uv pip install --python .output/venv/Scripts/python.exe (Get-ChildItem dist/*.whl).FullName flask==3.1.3 requests==2.34.2
          if ($LASTEXITCODE -ne 0) { throw 'Wheel installation failed' }
          uv pip check --python .output/venv/Scripts/python.exe
          if ($LASTEXITCODE -ne 0) { throw 'Dependency check failed' }
      - name: Real SDK lifecycle and native launcher integration
        run: .output/venv/Scripts/python.exe tests/native_lifecycle.py .output/ability.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ability-py-windows-verified
          path: dist/*.whl
          if-no-files-found: error
